name: Android widget APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: APK derle
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Yeniden adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk KonsensusHava.apk
      - uses: actions/upload-artifact@v4
        with: { name: KonsensusHava-apk, path: KonsensusHava.apk }
      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget
          name: Android widget (son sürüm)
          body: |
            Konsensüs Hava Android widget'ı — şimdiki sıcaklık + 3 günlük yağmur olasılığı.
            Telefonda indir: https://github.com/kkyelox/konsensus-hava/releases/download/widget/KonsensusHava.apk
          files: KonsensusHava.apk
          make_latest: true
