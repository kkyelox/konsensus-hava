name: Günlük tahmin kaydı ve doğrulama
on:
  schedule:
    - cron: '17 3 * * *'   # her gün 06:17 (Türkiye saati)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/daily.mjs
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "hava-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Günlük veri: $(date -u +%F)"
          git push
